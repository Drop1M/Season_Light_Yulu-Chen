<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Season Light — Yulu Chen</title>
<style>


canvas {
  width: 100vw !important;
  height: 100vh !important;
  display: block;
}

html, body {
  margin: 0; padding: 0;
  overflow: hidden;
  background: #000;
  cursor: none;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

/* ── Season label (top-right) ─────────────────────────────────────── */
#seasonLabel {
  position: fixed;
  right: 28px;
  top: 24px;
  text-align: right;
  z-index: 10;
  pointer-events: none;
  line-height: 1;
}
#season-name {
  display: block;
  font-size: clamp(14px, 1.6vw, 18px);
  font-weight: 200;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.82);
}
#season-word {
  display: block;
  font-size: clamp(9px, 0.9vw, 11px);
  font-weight: 300;
  letter-spacing: 0.42em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.32);
  margin-top: 6px;
}

/* ── Gesture hint (below season label) ───────────────────────────── */
#gestureHint {
  position: fixed;
  right: 28px;
  top: 80px;
  max-width: 240px;
  text-align: right;
  z-index: 10;
  pointer-events: none;
  font-size: clamp(10px, 0.95vw, 12px);
  font-style: italic;
  font-weight: 300;
  letter-spacing: 0.03em;
  line-height: 1.7;
  color: rgba(255,255,255,0.38);
  transition: opacity 0.6s ease;
}

/* ── Status + interaction tip (bottom-left) ──────────────────────── */
#status {
  position: fixed;
  left: 24px;
  bottom: 24px;
  z-index: 10;
  pointer-events: none;
  line-height: 1;
}
#status-line {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.32);
}
.dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  flex-shrink: 0;
  transition: background 0.5s;
}
.dot.active { background: rgba(140,255,180,0.85); box-shadow: 0 0 5px rgba(140,255,180,0.4); }
.dot.error  { background: rgba(255,90,90,0.85); }

#handStatusText {
  margin-top: 6px;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
}

/* ── Camera movement tip (bottom-left, below status) ─────────────── */
#camera-tip {
  margin-top: 10px;
  font-size: 10px;
  font-style: italic;
  letter-spacing: 0.05em;
  line-height: 1.6;
  color: rgba(255,255,255,0.2);
}

/* ── Debug panel (hidden — press D to toggle at runtime) ─────────── */
#debugInfo {
  display: none;
  position: fixed;
  left: 24px;
  bottom: 140px;
  font-family: 'SF Mono', Consolas, monospace;
  font-size: 10px;
  color: rgba(124,255,178,0.85);
  z-index: 10;
  pointer-events: none;
  white-space: pre;
  background: rgba(0,0,0,0.55);
  padding: 8px 12px;
  border-radius: 4px;
  border: 1px solid rgba(124,255,178,0.15);
  line-height: 1.55;
}

</style>
</head>
<body>

<!-- Season label -->
<div id="seasonLabel">
  <span id="season-name"></span>
  <span id="season-word"></span>
</div>

<!-- Gesture hint -->
<div id="gestureHint"></div>

<!-- Camera status + tip -->
<div id="status">
  <div id="status-line">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Initialising camera…</span>
  </div>
  <div id="handStatusText">Loading gesture tracking…</div>
  <div id="camera-tip">
    Move your face to shift the light source<br>
    Raise your hand to interact
  </div>
</div>

<!-- Debug (hidden) -->
<div id="debugInfo"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>

<script>
window.updateSeasonLabelDOM = function(labelText) {
  const parts = labelText.split('·');
  const nameEl = document.getElementById('season-name');
  const wordEl = document.getElementById('season-word');
  if (nameEl) nameEl.textContent = parts[0] ? parts[0].trim() : '';
  if (wordEl) wordEl.textContent = parts[1] ? parts[1].trim() : '';
};
</script>

<script src="sketch.js"></script>
</body>
</html>
